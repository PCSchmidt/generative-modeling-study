[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-modeling-study"
version = "0.2.0"
description = "A from-scratch study of β-VAE generative modeling on MNIST"
authors = [{ name = "Chris Schmidt" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5", "scikit-learn>=1.3"]
study = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.mypy]
strict = true
ignore_missing_imports = true
